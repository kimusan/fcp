name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            deb-arch: amd64
            ubuntu: '24.04'
          - arch: arm64
            deb-arch: arm64
            ubuntu: '24.04'
    runs-on: ubuntu-${{ matrix.ubuntu }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update || true
          echo "Installing packages for ${{ matrix.arch }}..."
          sudo apt-get install -y build-essential debhelper devscripts libssl-dev
          echo "Verifying installation..."
          dpkg -l | grep -E "debhelper|devscripts" || echo "WARNING: packages not found in dpkg"
          which dch && echo "dch found" || echo "dch NOT found"
          which dh && echo "dh found" || echo "dh NOT found"

      - name: Install cross-compilation tools
        if: matrix.arch == 'arm64'
        run: |
          set -e
          echo "Adding arm64 architecture..."
          sudo dpkg --add-architecture arm64
          echo "Updating package lists..."
          sudo apt-get update
          echo "Installing cross-compilation tools..."
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64
          echo "Cross-compilation tools installed successfully"

      - name: Build binary
        env:
          CC: ${{ matrix.arch == 'amd64' && 'gcc' || (matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'arm-linux-gnueabihf-gcc') }}
          CFLAGS: '-O2 -Wall -Wextra -std=gnu11'
        run: |
          set -e
          echo "Building for ${{ matrix.arch }} with $CC..."
          make clean
          make
          echo "Binary built successfully"
          ls -la fcp
          file fcp || true

      - name: Create tarball
        run: |
          VERSION=$(./fcp --version | awk '{print $2}')
          tar -czf fcp_${VERSION}_Linux_${{ matrix.arch }}.tar.gz \
            fcp \
            man/fcp.1

      - name: Build deb package
        run: |
          set -e
          VERSION=$(./fcp --version | awk '{print $2}')
          echo "Building fcp version $VERSION for ${{ matrix.arch }}"
          # Update changelog
          dch --local ~github --distribution unstable "Automated build from $GITHUB_SHA for ${{ matrix.arch }}"
          # Build deb
          dpkg-buildpackage -us -uc -b -d
          # Rename to include arch
          mv ../fcp_${VERSION}-1_${{ matrix.deb-arch }}.deb \
             fcp_${VERSION}_${{ matrix.deb-arch }}.deb

      - name: Build RPM package
        run: |
          set -e
          VERSION=$(./fcp --version | awk '{print $2}')
          echo "Building fcp version $VERSION RPM"
          # Install RPM build tools
          sudo apt-get install -y rpm rpmbuild
          # Setup RPM build environment
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          # Create source tarball
          tar -czf ~/rpmbuild/SOURCES/fcp-${VERSION}.tar.gz \
            --transform 's,^,fcp-${VERSION}/,' \
            Makefile fcp.c util.c copy.c identical.c hash.c progress.c colors.c queue.c config.c \
            fcp.h util.h copy.h identical.h hash.h progress.h colors.h queue.h config.h \
            fcp.spec man/fcp.1
          # Build RPM
          rpmbuild -bb fcp.spec --define "_topdir $(pwd)/rpmbuild"
          # Move RPMs to current directory
          ls -la rpmbuild/RPMS/*/fcp-${VERSION}*.rpm
          mv rpmbuild/RPMS/*/fcp-${VERSION}*.rpm . 2>/dev/null || \
          mv rpmbuild/RPMS/noarch/fcp-${VERSION}*.rpm . 2>/dev/null || \
          mv rpmbuild/RPMS/x86_64/fcp-${VERSION}*.rpm . 2>/dev/null || \
          mv rpmbuild/RPMS/aarch64/fcp-${VERSION}*.rpm . 2>/dev/null || \
          echo "RPM not found in expected location"

      - name: Build PKGEXT package (Arch Linux)
        run: |
          set -e
          VERSION=$(./fcp --version | awk '{print $2}')
          echo "Building fcp version $VERSION PKGEXT"
          # Install packer/pacman if needed
          sudo apt-get install -y pacutils
          # Build PKGEXT
          makepkg --noconfirm --skippgpcheck
          # Rename to include version
          ls -la *.pkg.tar.*

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fcp_*.deb
            fcp-*.rpm
            *.pkg.tar.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}