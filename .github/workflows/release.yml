name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            deb-arch: amd64
            ubuntu: noble
          - arch: arm64
            deb-arch: arm64
            ubuntu: noble
          - arch: armhf
            deb-arch: armhf
            ubuntu: jammy
    runs-on: ubuntu-${{ matrix.ubuntu }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          echo "Installing packages for ${{ matrix.arch }}..."
          sudo apt-get install -y build-essential debhelper devscripts libssl-dev
          echo "Verifying installation..."
          dpkg -l | grep -E "debhelper|devscripts" || echo "WARNING: packages not found in dpkg"
          which dch && echo "dch found" || echo "dch NOT found"
          which dh && echo "dh found" || echo "dh NOT found"

      - name: Install cross-compilation tools
        if: matrix.arch != 'amd64'
        run: |
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu' || 'arm-linux-gnueabihf' }}
          sudo apt-get install -y libssl-dev:${{ matrix.arch }}

      - name: Build binary
        env:
          CC: ${{ matrix.arch == 'amd64' && 'gcc' || (matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'arm-linux-gnueabihf-gcc') }}
          CFLAGS: '-O2 -Wall -Wextra -std=gnu11'
        run: |
          set -e
          echo "Building for ${{ matrix.arch }} with $CC..."
          make clean
          make
          echo "Binary built successfully"
          ls -la fcp
          file fcp || true

      - name: Create tarball
        run: |
          VERSION=$(./fcp --version | awk '{print $2}')
          tar -czf fcp_${VERSION}_Linux_${{ matrix.arch }}.tar.gz \
            fcp \
            man/fcp.1

      - name: Build deb package
        run: |
          set -e
          VERSION=$(./fcp --version | awk '{print $2}')
          echo "Building fcp version $VERSION for ${{ matrix.arch }}"
          # Update changelog
          dch --local ~github --distribution unstable "Automated build from $GITHUB_SHA for ${{ matrix.arch }}"
          # Build deb
          dpkg-buildpackage -us -uc -b -d
          # Rename to include arch
          mv ../fcp_${VERSION}-1_${{ matrix.deb-arch }}.deb \
             fcp_${VERSION}_${{ matrix.deb-arch }}.deb

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fcp_*.tar.gz
            fcp_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}